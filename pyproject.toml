[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dkwess-securerepo"
version = "0.0.6"
description = "Evidence-oriented repository governance, supply-chain hygiene and GitHub Actions auditor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "DKWesley13"}]
keywords = ["security", "github-actions", "repository", "governance", "supply-chain", "audit", "ci", "provenance", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/DKWesley13/DkWess"
Documentation = "https://github.com/DKWesley13/DkWess/tree/main/docs"
Issues = "https://github.com/DKWesley13/DkWess/issues"

[project.scripts]
dkwess-securerepo = "dkwess_securerepo.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
