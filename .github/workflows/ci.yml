name: SecureRepo CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  test-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout exact GitHub ref without third-party actions
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$SERVER_URL/$REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$REF"
          git checkout --detach FETCH_HEAD
      - name: Compile, test and self-audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python --version
          python -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python -m compileall -q src
          python -m unittest discover -s tests -v
          python -m dkwess_securerepo --version
          python -m dkwess_securerepo --list-checks >/dev/null
          python -m dkwess_securerepo --show-limits >/dev/null
          python -m dkwess_securerepo . --output reports --fail-on HIGH
          python -m dkwess_securerepo . --no-reports --release-check

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact GitHub ref without third-party actions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin $env:GITHUB_REF
          git checkout --detach FETCH_HEAD
      - name: Compile, test and self-audit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "src"
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          python -m compileall -q src
          python -m unittest discover -s tests -v
          python -m dkwess_securerepo --version
          python -m dkwess_securerepo --list-checks | Out-Null
          python -m dkwess_securerepo --show-limits | Out-Null
          python -m dkwess_securerepo . --output reports --fail-on HIGH
          python -m dkwess_securerepo . --no-reports --release-check
