name: SecureRepo CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact GitHub ref without third-party actions
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$SERVER_URL/$REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$REF"
          git checkout --detach FETCH_HEAD

      - name: Verify Python and compile source
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python -m compileall -q src

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m unittest discover -s tests -v

      - name: CLI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m dkwess_securerepo --version
          python -m dkwess_securerepo --list-checks >/dev/null
          python -m dkwess_securerepo --explain SR-GHA-010 >/dev/null

      - name: Self-audit repository
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m dkwess_securerepo . --output reports --fail-on HIGH
